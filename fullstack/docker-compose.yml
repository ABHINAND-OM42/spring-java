version: '3.8'

services:
  backend:
    container_name: springboot-backend
    build: 
      context: ./spring
    ports:
      - "8080:8080"
    environment:
      # External Oracle connection
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@172.17.0.1:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: AB42
      SPRING_DATASOURCE_PASSWORD: ab42
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    networks:
      - app-network

  frontend:
    container_name: react-frontend
    build: 
      context: ./react
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app-network

# Network for backend/frontend communication
networks:
  app-network:
    driver: bridge
